<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Asuransi Jiwa Sejahtera</title>
<link rel="stylesheet" href="assets/style.css">
<style>
:root{--blue:#0d47a1;--blue2:#1976d2;--light:#e3f2fd;--bg:#f5f8fc;--text:#263238}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}a{color:var(--blue2)}
.top{position:sticky;top:0;z-index:20;background:#fff;box-shadow:0 2px 12px #0001}.nav{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;gap:18px}.brand{font-weight:800;color:var(--blue);white-space:nowrap}.links{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}.links a{font-size:13px;text-decoration:none;color:#37474f;padding:7px 8px;border-radius:7px}.links a:hover,.links a.active{background:var(--light);color:var(--blue)}
main{max-width:1200px;margin:auto}.page{display:none;padding:28px 20px}.page.active{display:block}.hero{background:linear-gradient(135deg,var(--blue),var(--blue2),#42a5f5);color:#fff;border-radius:20px;padding:65px 25px;text-align:center}.hero h1{font-size:42px;margin:0 0 12px}.hero p{font-size:17px;line-height:1.7}.btn{display:inline-block;border:0;border-radius:24px;padding:12px 20px;font-weight:700;text-decoration:none;cursor:pointer;margin:5px}.primary{background:#ffd54f;color:var(--blue)}.outline{background:transparent;color:#fff;border:2px solid #fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px;margin:22px 0}.card{background:#fff;border-radius:15px;padding:20px;box-shadow:0 5px 20px #0000000d}.stat{text-align:center}.stat b{display:block;font-size:30px;color:var(--blue);margin-bottom:5px}.title{text-align:center;color:var(--blue);margin:8px 0 22px}.price{font-size:21px;font-weight:800;color:var(--blue2)}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;background:#fff}.table th,.table td{padding:12px;border-bottom:1px solid #e5e7eb;text-align:left}.table th{background:var(--light);color:var(--blue)}.badge{display:inline-block;padding:5px 10px;border-radius:15px;background:#e8f5e9;color:#2e7d32;font-size:12px;font-weight:700}.notice{padding:12px 15px;background:var(--light);border-left:4px solid var(--blue2);border-radius:8px;margin:15px 0}.footer{text-align:center;background:#fff;padding:25px;color:#607d8b;margin-top:20px}.search{width:100%;padding:11px;border:2px solid var(--light);border-radius:9px;margin-bottom:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.small{font-size:13px;color:#607d8b}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:50;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modalbox{background:#fff;width:min(430px,100%);border-radius:18px;padding:25px;position:relative}.close{position:absolute;right:14px;top:10px;border:0;background:none;font-size:26px;cursor:pointer}.field{margin:13px 0}.field label{display:block;font-size:13px;font-weight:700;color:var(--blue);margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:2px solid var(--light);border-radius:9px;font:inherit}.submit{width:100%;padding:12px;border:0;border-radius:24px;background:var(--blue2);color:#fff;font-weight:700;cursor:pointer}.msg{display:none;padding:10px;border-radius:8px;margin:10px 0;font-size:13px}.ok{background:#e8f5e9;color:#2e7d32}.err{background:#ffebee;color:#c62828}.auth{text-align:center;font-size:13px;margin-top:14px}.linkbtn{border:0;background:none;color:var(--blue2);font-weight:700;cursor:pointer}.hidden{display:none!important}
@media(max-width:800px){.nav{align-items:flex-start;flex-direction:column}.links{justify-content:flex-start}.hero h1{font-size:31px}.page{padding:22px 14px}}
</style>
</head>
<body>
<header class="top"><nav class="nav"><div class="brand">Asuransi Jiwa Sejahtera</div><div class="links" id="navLinks"></div></nav></header>
<main id="app"></main>
<div class="modal" id="authModal"><div class="modalbox"><button class="close" onclick="closeAuth()">×</button><div id="loginForm"></div><div id="registerForm" class="hidden"></div></div></div>
<div class="footer">© 2026 Asuransi Jiwa Sejahtera · GitHub Pages Preview</div>
<script>
const data={
 products:[['Asuransi Sejahtera',500000,'Santunan 100jt'],['Asuransi Premium',1000000,'Santunan 500jt'],['Asuransi Keluarga',750000,'Santunan 250jt']],
 nasabah:[['Andi Pratama','andi@email.com','0812-1111-2222'],['Rina Wulandari','rina@email.com','0813-3333-4444'],['Budi Santoso','budi@email.com','0814-5555-6666']],
 polis:[['PL-2026-0001','Andi Pratama','Asuransi Sejahtera','2026-01-15','Aktif',500000],['PL-2026-0002','Rina Wulandari','Asuransi Premium','2026-02-20','Aktif',1000000],['PL-2026-0003','Budi Santoso','Asuransi Keluarga','2026-03-10','Kadaluarsa',750000],['PL-2026-0004','Andi Pratama','Asuransi Premium','2026-04-05','Aktif',1000000]],
 pembayaran:[['PL-2026-0001',500000,'2026-01-15','Transfer','Lunas'],['PL-2026-0002',1000000,'2026-02-20','Virtual Account','Lunas'],['PL-2026-0003',750000,'2026-03-10','Tunai','Pending'],['PL-2026-0001',500000,'2026-04-15','Transfer','Lunas']],
 klaim:[['PL-2026-0001',5000000,'Disetujui','2026-01-20','Klaim rawat inap rumah sakit'],['PL-2026-0002',10000000,'Diproses','2026-02-25','Klaim kecelakaan lalu lintas'],['PL-2026-0003',7500000,'Ditolak','2026-03-15','Klaim tidak memenuhi syarat'],['PL-2026-0001',3000000,'Disetujui','2026-04-10','Klaim operasi kecil']]
};
const pages=['home','produk','nasabah','polis','pembayaran','klaim','gallery','tentang','kontak','agen','berita','faq','karir','simulasi','syarat','privasi','profil','dashboard'];
const labels={home:'Home',produk:'Produk',nasabah:'Nasabah',polis:'Polis',pembayaran:'Pembayaran',klaim:'Klaim',gallery:'Gallery',tentang:'Tentang',kontak:'Kontak',agen:'Agen',berita:'Berita',faq:'FAQ',karir:'Karir',simulasi:'Simulasi',syarat:'Syarat',privasi:'Privasi',profil:'Profil',dashboard:'Dashboard'};
function money(n){return 'Rp '+Number(n).toLocaleString('id-ID')}
function render(){const nav=document.getElementById('navLinks');nav.innerHTML=pages.map(p=>`<a href="#${p}" data-page="${p}">${labels[p]}</a>`).join('')+`<a href="#login" data-login="1" id="authLink">Login</a>`;document.getElementById('app').innerHTML=pages.map(p=>`<section class="page" id="page-${p}">${content(p)}</section>`).join('');route();updateAuthLink();}
function content(p){if(p==='home')return `<div class="hero"><h1>Asuransi Jiwa Sejahtera</h1><p>Perlindungan terbaik untuk keluarga tercinta Anda.<br>Premi terjangkau, klaim cepat, agen profesional.</p><a class="btn primary" href="#produk">Lihat Produk</a><a class="btn outline" href="#simulasi">Hitung Premi</a></div><div class="grid"><div class="card stat"><b>50K+</b>Nasabah Aktif</div><div class="card stat"><b>99%</b>Klaim Disetujui</div><div class="card stat"><b>18</b>Tahun Pengalaman</div><div class="card stat"><b>4.9</b>Rating Kepuasan</div></div><div class="notice"><b>Preview GitHub aktif.</b> Login dan daftar akun menggunakan localStorage browser. Versi JSP + MySQL asli tetap tersedia di folder <code>server/</code>.</div>`;
if(p==='produk')return `<h2 class="title">Produk Unggulan</h2><div class="grid">${data.products.map(x=>`<div class="card"><h3>${x[0]}</h3><div class="price">${money(x[1])}/tahun</div><p>${x[2]}</p><a class="btn primary" href="#simulasi">Pilih Produk</a></div>`).join('')}</div>`;
if(p==='nasabah')return `<h2 class="title">Data Nasabah</h2><input class="search" placeholder="Cari nasabah..." oninput="filterRows(this,'nasabahTable')"><div class="table-wrap"><table class="table" id="nasabahTable"><tr><th>Nama</th><th>Email</th><th>Telepon</th></tr>${data.nasabah.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td></tr>`).join('')}</table></div>`;
if(p==='polis')return `<h2 class="title">Data Polis</h2><div class="table-wrap"><table class="table"><tr><th>No Polis</th><th>Nasabah</th><th>Produk</th><th>Tanggal</th><th>Status</th><th>Premi</th></tr>${data.polis.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td><td><span class="badge">${x[4]}</span></td><td>${money(x[5])}</td></tr>`).join('')}</table></div>`;
if(p==='pembayaran')return `<h2 class="title">Pembayaran</h2><div class="table-wrap"><table class="table"><tr><th>Polis</th><th>Jumlah</th><th>Tanggal</th><th>Metode</th><th>Status</th></tr>${data.pembayaran.map(x=>`<tr><td>${x[0]}</td><td>${money(x[1])}</td><td>${x[2]}</td><td>${x[3]}</td><td>${x[4]}</td></tr>`).join('')}</table></div>`;
if(p==='klaim')return `<h2 class="title">Data Klaim</h2><div class="table-wrap"><table class="table"><tr><th>Polis</th><th>Jumlah</th><th>Status</th><th>Tanggal</th><th>Keterangan</th></tr>${data.klaim.map(x=>`<tr><td>${x[0]}</td><td>${money(x[1])}</td><td>${x[2]}</td><td>${x[3]}</td><td>${x[4]}</td></tr>`).join('')}</table></div>`;
if(p==='gallery')return `<h2 class="title">Gallery</h2><div class="grid">${['Layanan Nasabah','Konsultasi Asuransi','Perlindungan Keluarga','Pelayanan Klaim','Tim Profesional','Produk Unggulan'].map(x=>`<div class="card"><h3>${x}</h3><p>Dokumentasi layanan Asuransi Jiwa Sejahtera.</p></div>`).join('')}</div>`;
if(p==='tentang')return `<h2 class="title">Tentang Kami</h2><div class="card"><h3>Asuransi Jiwa Sejahtera</h3><p>Kami menyediakan perlindungan jiwa dan keluarga dengan pilihan produk, layanan klaim, pembayaran, serta konsultasi yang terintegrasi.</p><p>Preview ini mempertahankan struktur menu dari aplikasi JSP asli tanpa mengubah database asli.</p></div>`;
if(p==='kontak')return `<h2 class="title">Kontak</h2><div class="grid"><div class="card"><h3>Customer Service</h3><p>Email: layanan@asuransijiwa.test</p><p>Telepon: 021-12345678</p><p>WhatsApp: 0812-0000-0000</p></div><div class="card"><h3>Kirim Pesan</h3><div class="field"><input id="contactName" placeholder="Nama"></div><div class="field"><input id="contactEmail" placeholder="Email"></div><div class="field"><textarea id="contactMsg" rows="4" placeholder="Pesan"></textarea></div><button class="submit" onclick="sendMessage()">Kirim Pesan</button><div id="contactMsgBox" class="msg ok">Pesan tersimpan di browser untuk preview.</div></div></div>`;
if(p==='agen')return `<h2 class="title">Agen</h2><div class="grid">${['Andi Pratama','Rina Wulandari','Budi Santoso'].map((x,i)=>`<div class="card"><h3>${x}</h3><p>Agen Asuransi Jiwa Sejahtera</p><p>Area layanan Indonesia</p><a class="btn primary" href="#kontak">Hubungi</a></div>`).join('')}</div>`;
if(p==='berita')return `<h2 class="title">Berita</h2><div class="grid"><div class="card"><h3>Tips Memilih Asuransi Jiwa</h3><p>Pahami kebutuhan perlindungan, manfaat, premi, dan ketentuan polis sebelum memilih produk.</p></div><div class="card"><h3>Layanan Klaim</h3><p>Gunakan menu klaim untuk melihat status pengajuan pada sistem.</p></div></div>`;
if(p==='faq')return `<h2 class="title">FAQ</h2><div class="grid">${[['Apa itu asuransi jiwa?','Perlindungan finansial bagi pihak yang diasuransikan sesuai ketentuan polis.'],['Bagaimana pembayaran premi?','Pembayaran dapat dilakukan sesuai metode yang tersedia pada polis.'],['Bagaimana mengajukan klaim?','Siapkan dokumen dan ajukan klaim sesuai ketentuan produk.']].map(x=>`<div class="card"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div>`;
if(p==='karir')return `<h2 class="title">Karir</h2><div class="card"><h3>Kesempatan Bergabung</h3><p>Kami membuka kesempatan bagi kandidat yang tertarik pada layanan asuransi, teknologi, pemasaran, dan pelayanan nasabah.</p><a class="btn primary" href="#kontak">Hubungi Kami</a></div>`;
if(p==='simulasi')return `<h2 class="title">Simulasi Premi</h2><div class="card"><div class="field"><label>Usia</label><input type="number" id="age" value="30" min="1"></div><div class="field"><label>Produk</label><select id="simProduct">${data.products.map(x=>`<option value="${x[1]}">${x[0]}</option>`).join('')}</select></div><button class="submit" onclick="simulate()">Hitung</button><div id="simResult" class="notice hidden"></div></div>`;
if(p==='syarat')return `<h2 class="title">Syarat & Ketentuan</h2><div class="card"><ol><li>Data nasabah harus benar dan lengkap.</li><li>Manfaat dan premi mengikuti produk yang dipilih.</li><li>Pengajuan klaim mengikuti ketentuan polis.</li><li>Gunakan akun secara bertanggung jawab.</li></ol></div>`;
if(p==='privasi')return `<h2 class="title">Kebijakan Privasi</h2><div class="card"><p>Preview GitHub ini menyimpan akun demo di localStorage browser. Jangan gunakan password penting pada demo publik.</p></div>`;
if(p==='profil')return `<h2 class="title">Profil</h2><div class="card"><p>Status login: <b id="profileStatus">Belum login</b></p><p>Role: <b id="profileRole">-</b></p></div>`;
if(p==='dashboard')return `<h2 class="title">Dashboard</h2><div id="dashboardBox"></div>`;return ''}
function route(){let p=location.hash.replace('#','')||'home';if(p==='login'){openAuth();p='home'}if(!pages.includes(p))p='home';document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById('page-'+p).classList.add('active');document.querySelectorAll('.links a[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===p));updateDashboard();updateProfile();}
function filterRows(input,id){let q=input.value.toLowerCase();document.querySelectorAll('#'+id+' tr').forEach((r,i)=>{if(i===0)return;r.style.display=r.innerText.toLowerCase().includes(q)?'':'none'})}
function showLogin(){document.getElementById('loginForm').classList.remove('hidden');document.getElementById('registerForm').classList.add('hidden');document.getElementById('authModal').classList.add('show')}
function showRegister(){document.getElementById('loginForm').classList.add('hidden');document.getElementById('registerForm').classList.remove('hidden');document.getElementById('authModal').classList.add('show')}
function closeAuth(){document.getElementById('authModal').classList.remove('show');location.hash='home'}
function authMarkup(){document.getElementById('loginForm').innerHTML=`<h2 style="color:var(--blue)">Login</h2><div id="loginMsg" class="msg err"></div><div class="field"><label>Username</label><input id="username" autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><button class="submit" onclick="login()">Masuk</button><div class="auth">Belum punya akun? <button class="linkbtn" onclick="showRegister()">Daftar Akun</button></div><div class="notice"><b>Demo:</b> admin / admin</div>`;document.getElementById('registerForm').innerHTML=`<h2 style="color:var(--blue)">Daftar Akun</h2><div id="regMsg" class="msg"></div><div class="field"><label>Username</label><input id="regUser" autocomplete="username"></div><div class="field"><label>Password</label><input id="regPass" type="password" autocomplete="new-password"></div><div class="field"><label>Konfirmasi Password</label><input id="regPass2" type="password" autocomplete="new-password"></div><button class="submit" onclick="register()">Buat Akun</button><div class="auth">Sudah punya akun? <button class="linkbtn" onclick="showLogin()">Kembali ke Login</button></div>`}
function users(){let u=JSON.parse(localStorage.getItem('asuransi_users')||'null');if(!u){u=[{username:'admin',password:'admin',role:'admin'}];localStorage.setItem('asuransi_users',JSON.stringify(u))}return u}
function login(){let u=document.getElementById('username').value.trim(),p=document.getElementById('password').value,found=users().find(x=>x.username===u&&x.password===p);let m=document.getElementById('loginMsg');m.style.display='block';if(!found){m.textContent='Username atau password salah.';return}localStorage.setItem('asuransi_session',JSON.stringify(found));closeAuth();updateAuthLink();location.hash='dashboard';alert('Login berhasil. Selamat datang, '+found.username+'!')}
function register(){let u=document.getElementById('regUser').value.trim(),p=document.getElementById('regPass').value,p2=document.getElementById('regPass2').value,m=document.getElementById('regMsg');m.style.display='block';m.className='msg err';if(u.length<3){m.textContent='Username minimal 3 karakter.';return}if(p.length<4){m.textContent='Password minimal 4 karakter.';return}if(p!==p2){m.textContent='Konfirmasi password tidak sama.';return}let all=users();if(all.some(x=>x.username.toLowerCase()===u.toLowerCase())){m.textContent='Username sudah digunakan.';return}all.push({username:u,password:p,role:'user'});localStorage.setItem('asuransi_users',JSON.stringify(all));m.className='msg ok';m.textContent='Akun berhasil dibuat. Silakan login.';setTimeout(showLogin,700)}
function updateAuthLink(){let a=document.getElementById('authLink'),s=JSON.parse(localStorage.getItem('asuransi_session')||'null');if(s){a.textContent='Logout ('+s.username+')';a.onclick=e=>{e.preventDefault();localStorage.removeItem('asuransi_session');updateAuthLink();location.hash='home';alert('Berhasil logout.')}}else{a.textContent='Login';a.onclick=e=>{e.preventDefault();showLogin()}}}
function updateDashboard(){let b=document.getElementById('dashboardBox');if(!b)return;let s=JSON.parse(localStorage.getItem('asuransi_session')||'null');b.innerHTML=s?`<div class="grid"><div class="card stat"><b>${data.nasabah.length}</b>Data Nasabah Preview</div><div class="card stat"><b>${data.polis.length}</b>Polis</div><div class="card stat"><b>${data.klaim.length}</b>Klaim</div><div class="card stat"><b>${users().length}</b>Akun</div></div><div class="card"><h3>Selamat datang, ${s.username}</h3><p>Role: ${s.role}. Ini adalah dashboard preview GitHub.</p></div>`:`<div class="card"><h3>Login diperlukan</h3><p>Silakan login untuk membuka dashboard.</p><button class="btn primary" onclick="showLogin()">Login</button></div>`}
function updateProfile(){let s=JSON.parse(localStorage.getItem('asuransi_session')||'null');let a=document.getElementById('profileStatus'),b=document.getElementById('profileRole');if(a){a.textContent=s?'Login sebagai '+s.username:'Belum login';b.textContent=s?s.role:'-'}}
function simulate(){let age=Number(document.getElementById('age').value),premi=Number(document.getElementById('simProduct').value),r=document.getElementById('simResult');let factor=age<30?0.9:age<=40?1:age<=50?1.2:1.5;r.classList.remove('hidden');r.innerHTML='<b>Estimasi premi:</b> '+money(premi*factor)+' / tahun';}
function sendMessage(){let m=document.getElementById('contactMsgBox');m.style.display='block';localStorage.setItem('last_contact',JSON.stringify({name:contactName.value,email:contactEmail.value,message:contactMsg.value,date:new Date().toISOString()}));}
window.addEventListener('hashchange',route);authMarkup();render();
</script>
</body>
</html>
