<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AsuransiJiwa — Preview</title><style>
:root{font-family:system-ui,Arial;color:#173052;background:#f3f7fc}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(110deg,#092d6d,#1478d2);color:white;padding:22px 5%}header h1{margin:0}header p{margin:6px 0 0;opacity:.85}.layout{display:flex;min-height:calc(100vh - 100px)}nav{width:220px;background:white;padding:18px;box-shadow:1px 0 8px #dbe4f2}nav button{display:block;width:100%;text-align:left;margin:6px 0;border:0;background:transparent;padding:12px;border-radius:9px;color:#23466d;cursor:pointer}nav button.active,nav button:hover{background:#e7f1ff;color:#0755b6}main{flex:1;min-width:0;padding:26px 4%}.notice{padding:13px 16px;background:#fff5d9;border-left:4px solid #e3a900;border-radius:8px;margin-bottom:22px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:15px}.card,.panel{background:white;border-radius:13px;padding:20px;box-shadow:0 3px 12px #dce5f1}.card b{font-size:29px;color:#0e5fbd}.card p{margin-bottom:0;color:#687b92}.panel{margin-top:20px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:520px}td,th{padding:12px;text-align:left;border-bottom:1px solid #e6edf6}th{background:#f3f7fd}h2{margin-top:0}input,select{padding:11px;border:1px solid #d0deec;border-radius:8px;margin:6px 8px 6px 0;max-width:100%}button.primary{background:#1167c2;border:0;color:white;padding:11px 16px;border-radius:8px;cursor:pointer}.muted{color:#65778a}#message{margin-top:12px;color:#087a4e}@media(max-width:700px){.layout{display:block}nav{width:100%;display:flex;overflow:auto;padding:8px}nav button{min-width:max-content}main{padding:18px}}
</style></head><body><header><h1>🛡️ AsuransiJiwa</h1><p>Preview interaktif fitur sistem asuransi</p></header><div class="layout"><nav id="nav"></nav><main><div class="notice"><strong>Mode demonstrasi GitHub Pages.</strong> Data hanya contoh dan perubahan tersimpan sementara di browser. Login, database MySQL, dan transaksi asli memerlukan server JSP/Servlet.</div><div id="content"></div></main></div><script>
const initial={nasabah:[{id:1,nama:'Andi Pratama',email:'andi@example.com',telepon:'081211112222'},{id:2,nama:'Rina Wulandari',email:'rina@example.com',telepon:'081333334444'},{id:3,nama:'Budi Santoso',email:'budi@example.com',telepon:'081455556666'}],produk:[{id:1,nama:'Asuransi Sejahtera',premi:500000,manfaat:'Santunan 100jt'},{id:2,nama:'Asuransi Premium',premi:1000000,manfaat:'Santunan 500jt'},{id:3,nama:'Asuransi Keluarga',premi:750000,manfaat:'Santunan 250jt'}],polis:[{id:1,no_polis:'PL-2026-0001',nasabah_id:1,produk_id:1,status:'Aktif',premi:500000},{id:2,no_polis:'PL-2026-0002',nasabah_id:2,produk_id:2,status:'Aktif',premi:1000000},{id:3,no_polis:'PL-2026-0003',nasabah_id:3,produk_id:3,status:'Kadaluarsa',premi:750000}],pembayaran:[{id:1,polis_id:1,jumlah:500000,tanggal:'2026-01-15',status:'Lunas'},{id:2,polis_id:2,jumlah:1000000,tanggal:'2026-02-20',status:'Lunas'}],klaim:[{id:1,polis_id:1,jumlah:5000000,status:'Disetujui',keterangan:'Rawat inap'},{id:2,polis_id:2,jumlah:10000000,status:'Diproses',keterangan:'Kecelakaan'}]};
let data=structuredClone(initial);const sections=['Dashboard','Nasabah','Produk','Polis','Pembayaran','Klaim','Simulasi Premi','Login / Daftar'];let current='Dashboard';const fmt=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function nav(){document.getElementById('nav').innerHTML=sections.map(s=>`<button class="${s===current?'active':''}" data-page="${esc(s)}">${esc(s)}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{current=b.dataset.page;render()})}function table(k){const rows=data[k],cols=Object.keys(rows[0]||{});return `<div class="panel"><h2>Data ${esc(current)}</h2><p class="muted">Tabel contoh dari struktur proyek. Form di bawah hanya simulasi lokal.</p><table><thead><tr>${cols.map(c=>`<th>${esc(c.replaceAll('_',' '))}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(['premi','jumlah'].includes(c)?fmt(r[c]):r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="panel"><h2>Tambah Data Demo</h2><form id="addform">${cols.filter(c=>c!=='id').map(c=>`<label>${esc(c)}<br><input name="${esc(c)}" required></label>`).join('')}<p><button class="primary">Simpan di Preview</button></p></form><div id="message"></div></div>`}function render(){nav();let c=document.getElementById('content');if(current==='Dashboard'){c.innerHTML=`<h2>Ringkasan Dashboard</h2><div class="cards">${['nasabah','produk','polis','pembayaran','klaim'].map(k=>`<div class="card"><b>${data[k].length}</b><p>Total ${esc(k)}</p></div>`).join('')}</div><div class="panel"><h2>Selamat datang</h2><p>Gunakan menu di samping untuk mencoba tabel dan input data contoh. Preview ini tidak mengirim data ke server.</p></div>`}else if(current==='Simulasi Premi'){c.innerHTML=`<div class="panel"><h2>Simulasi Premi</h2><p>Estimasi ilustratif, bukan penawaran resmi asuransi.</p><label>Produk<br><select id="product">${data.produk.map(p=>`<option value="${p.id}">${esc(p.nama)}</option>`).join('')}</select></label><label>Jumlah bulan<br><input id="months" type="number" min="1" max="120" value="12"></label><p><button class="primary" id="calculate">Hitung</button></p><div id="message"></div></div>`;document.getElementById('calculate').onclick=()=>{let p=data.produk.find(p=>p.id==document.getElementById('product').value),n=Number(document.getElementById('months').value);document.getElementById('message').textContent=Number.isInteger(n)&&n>=1&&n<=120?`Ilustrasi total premi: ${fmt(p.premi*n)} (${n} bulan, asumsi premi bulanan).`:'Masukkan 1–120 bulan.'}}else if(current==='Login / Daftar'){c.innerHTML=`<div class="panel"><h2>Login & Pendaftaran</h2><p>Form autentikasi tersedia dalam aplikasi JSP asli. Pada GitHub Pages, login dan pendaftaran hanya dapat ditampilkan sebagai preview, bukan autentikasi nyata.</p><input placeholder="Username" autocomplete="off"><input type="password" placeholder="Password"><p><button class="primary" id="login">Coba Login Demo</button></p><div id="message"></div></div>`;document.getElementById('login').onclick=()=>document.getElementById('message').textContent='Ini preview statis. Jalankan aplikasi JSP pada server untuk login sungguhan.'}else{let k=current.toLowerCase();c.innerHTML=table(k);document.getElementById('addform').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),r={id:Math.max(0,...data[k].map(x=>x.id))+1};for(const [key,val] of f.entries())r[key]=['premi','jumlah','polis_id','nasabah_id','produk_id'].includes(key)?Number(val):val;data[k].push(r);render()}}}render();
</script></body></html>
